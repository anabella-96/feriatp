<!-- SECCIÓN: HISTORIAL DE CAMBIOS - bitácora de acciones (edición, creación, eliminación...). -->
<section id="section-historial" class="content-section">
    <h2 class="section-title">Historial de Cambios</h2>
    <p class="section-subtitle">Registro de todas las acciones realizadas en el sistema</p>
    <div class="card mt-6">
        <div class="filters-inline mb-4">
            <input type="date" class="form-control w-180" id="filtroFecha">
            <select class="form-control w-200" id="filtroAccion">
                <option value="todas">Todas las acciones</option>
                <option value="Creación">Creación</option>
                <option value="Edición">Edición</option>
                <option value="Eliminación">Eliminación</option>
                <option value="Inicio sesión">Inicio de sesión</option>
                <option value="Reporte">Reporte</option>
            </select>
            <select class="form-control w-200" id="filtroUsuario">
                <option value="todos">Todos los usuarios</option>
                <option value="Carlos Ramírez">Carlos Ramírez</option>
                <option value="Luis Martínez">Luis Martínez</option>
                <option value="Ana Ruiz">Ana Ruiz</option>
            </select>
            <button class="btn btn-outline" id="btnFiltrar">Filtrar</button>
        </div>
        <div class="table-container">
            <table class="data-table" id="tablaHistorial">
                <thead>
                    <tr>
                        <th>Fecha y hora</th>
                        <th>Usuario</th>
                        <th>Acción realizada</th>
                        <th>Módulo afectado</th>
                        <th>Detalles</th>
                        <th>Dirección IP</th>
                    </tr>
                </thead>
                <tbody id="cuerpoHistorial">
                    <!-- Los registros se cargan aquí -->
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- LÓGICA JAVASCRIPT - Historial de Cambios -->
<script>
// Registros iniciales
const registrosIniciales = [
    { fecha: "07/07/2026 08:22:15", usuario: "Carlos Ramírez", accion: "Edición", modulo: "Usuarios", detalles: "Modificación de rol para usuario: sofiah", ip: "192.168.1.45" },
    { fecha: "07/07/2026 08:10:02", usuario: "Carlos Ramírez", accion: "Inicio sesión", modulo: "Acceso", detalles: "Ingreso exitoso al sistema", ip: "192.168.1.45" },
    { fecha: "06/07/2026 16:20:44", usuario: "Ana Ruiz", accion: "Creación", modulo: "Sesiones", detalles: "Programada nueva sesión: Matemáticas II", ip: "192.168.1.52" },
    { fecha: "06/07/2026 15:45:10", usuario: "Luis Martínez", accion: "Reporte", modulo: "Reportes", detalles: "Generado reporte de asistencia mensual", ip: "192.168.1.38" },
    { fecha: "05/07/2026 11:30:05", usuario: "Carlos Ramírez", accion: "Eliminación", modulo: "Estudiantes", detalles: "Eliminado registro: ID 20231022", ip: "192.168.1.45" }
];

// Cargar historial guardado o usar iniciales
let historial = JSON.parse(localStorage.getItem('historialCambios')) || registrosIniciales;

// Elementos del DOM
const cuerpoHistorial = document.getElementById('cuerpoHistorial');
const filtroFecha = document.getElementById('filtroFecha');
const filtroAccion = document.getElementById('filtroAccion');
const filtroUsuario = document.getElementById('filtroUsuario');
const btnFiltrar = document.getElementById('btnFiltrar');

// Iniciar
document.addEventListener('DOMContentLoaded', () => {
    renderizarHistorial();
    asignarEventos();
});

// Renderizar tabla con filtros opcionales
function renderizarHistorial() {
    cuerpoHistorial.innerHTML = '';

    // Obtener valores de filtro
    const fechaSeleccionada = filtroFecha.value;
    const accionSeleccionada = filtroAccion.value;
    const usuarioSeleccionado = filtroUsuario.value;

    // Convertir fecha del filtro de YYYY-MM-DD a DD/MM/AAAA para comparar
    const fechaFormateada = fechaSeleccionada ? 
        new Date(fechaSeleccionada + 'T00:00:00').toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'}) : 
        null;

    // Aplicar filtros
    const resultados = historial.filter(reg => {
        const coincideFecha = !fechaFormateada || reg.fecha.startsWith(fechaFormateada);
        const coincideAccion = accionSeleccionada === 'todas' || reg.accion === accionSeleccionada;
        const coincideUsuario = usuarioSeleccionado === 'todos' || reg.usuario === usuarioSeleccionado;
        return coincideFecha && coincideAccion && coincideUsuario;
    });

    // Mostrar resultados (del más reciente al más antiguo)
    resultados.reverse().forEach(reg => {
        const fila = document.createElement('tr');
        
        // Asignar color según tipo de acción
        let claseBadge = '';
        switch(reg.accion) {
            case 'Creación': claseBadge = 'bg-warning'; break;
            case 'Edición': claseBadge = 'bg-success'; break;
            case 'Eliminación': claseBadge = 'bg-danger'; break;
            case 'Inicio sesión': claseBadge = 'bg-info'; break;
            case 'Reporte': claseBadge = 'bg-primary'; break;
            default: claseBadge = 'bg-secondary';
        }

        fila.innerHTML = `
            <td>${reg.fecha}</td>
            <td>${reg.usuario}</td>
            <td><span class="badge ${claseBadge}">${reg.accion}</span></td>
            <td>${reg.modulo}</td>
            <td>${reg.detalles}</td>
            <td>${reg.ip}</td>
        `;
        cuerpoHistorial.appendChild(fila);
    });
}

// Agregar NUEVO registro al historial (función central que se conecta con tus otras secciones)
window.agregarAlHistorial = function(accion, modulo, detalles, usuario = 'Carlos Ramírez', ip = '192.168.1.45') {
    const fechaActual = new Date().toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' ' +
                        new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    
    historial.push({
        fecha: fechaActual,
        usuario: usuario,
        accion: accion,
        modulo: modulo,
        detalles: detalles,
        ip: ip
    });

    guardarHistorial();
    renderizarHistorial();
};

// Guardar en almacenamiento local
function guardarHistorial() {
    localStorage.setItem('historialCambios', JSON.stringify(historial));
}

// Asignar eventos
function asignarEventos() {
    btnFiltrar.addEventListener('click', renderizarHistorial);
    // Filtrar al presionar Enter o cambiar valores
    filtroFecha.addEventListener('change', renderizarHistorial);
    filtroAccion.addEventListener('change', renderizarHistorial);
    filtroUsuario.addEventListener('change', renderizarHistorial);
}
</script>
