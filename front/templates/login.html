<!-- =============================================================================
     SISTEMA DE CONTROL DE ASISTENCIA BIOMÉTRICA (Asistec)
     ARCHIVO: front/templates/login.html

     PROPÓSITO:
       Pantalla de inicio de sesión. Es una página AISLADA (sin sidebar ni
       navegación) que se muestra cuando NO hay una sesión activa.

       El formulario hace POST /login; si las credenciales son correctas
       (se validan contra la tabla `usuarios`), el servidor crea la sesión
       y redirige al dashboard (/). Si fallan, Flask muestra un mensaje
       flash (flash()) dentro de este template.

     USUARIOS DE PRUEBA (tras ejecutar db/init_db.py):
       usuario: carlosr   contraseña: 123456   (Administrador)
       usuario: luism     contraseña: 123456   (Profesor)
       usuario: anar      contraseña: 123456   (Profesor)
       usuario: sofiah    contraseña: 123456   (bloqueado - no puede entrar)
     ============================================================================= -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Asistec</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-box">
                <i class="fa-solid fa-users"></i>
            </div>
            <h1>Asistec</h1>
            <p>Control de asistencia biométrica</p>
        </div>

        <!-- Mensajes flash (éxito/error) que envía el servidor con flash(). -->
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="auth-form">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" class="form-control"
                       placeholder="Ej: carlosr" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
            </button>
        </form>

        <p class="auth-links">
            ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
        </p>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
