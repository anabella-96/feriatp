<!-- =============================================================================
     SISTEMA DE CONTROL DE ASISTENCIA BIOMÉTRICA (Asistec)
     ARCHIVO: front/templates/registro.html

     PROPÓSITO:
       Pantalla de creación de cuenta. El formulario hace POST /registro;
       el servidor crea el usuario con rol "Estudiante" (rol_id=3) por
       defecto, hashea la contraseña con werkzeug y redirige al login.

       La asignación de roles (Profesor/Administrador) se hace después en
       el módulo "Usuarios" del dashboard, solo por un administrador.
     ============================================================================= -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Asistec</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-box">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1>Crear cuenta</h1>
            <p>Únete al sistema Asistec</p>
        </div>

        <!-- Mensajes flash del servidor (por si algo falla). -->
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/registro" class="auth-form">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" class="form-control"
                       placeholder="Ej: Ana Pérez" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" class="form-control"
                       placeholder="tu@correo.edu" required>
            </div>

            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" class="form-control"
                       placeholder="Ej: anaperez" required>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Mínimo 4 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="password2">Repetir contraseña</label>
                    <input type="password" id="password2" name="password2" class="form-control"
                           placeholder="Repite la contraseña" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-user-check"></i> Crear cuenta
            </button>
        </form>

        <p class="auth-links">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
        </p>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
